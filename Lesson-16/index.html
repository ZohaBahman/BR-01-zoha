<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Crown SVG</title>

    <link rel="stylesheet" href="./dist/style.css">

</head>

<body>
    <div class="flex_container">

        <div>
            <svg class="emoji" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

                <circle cx="256" cy="256" r="230" fill="#FFD766" stroke="#E0A800" />


                <rect x="110" y="200" width="100" height="20" rx="10" fill="#E38B00" />
                <rect x="300" y="200" width="100" height="20" rx="10" fill="#E38B00" />


                <rect x="160" y="360" width="180" height="20" rx="12" fill="#F0C419" />
            </svg>
        </div>

        <div>
            <svg class="emoji" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

                <circle cx="256" cy="256" r="230" fill="#FFD766" stroke="#E0A800" />


                <circle cx="170" cy="200" r="32" fill="#AF8066" />
                <circle cx="330" cy="200" r="32" fill="#AF8066" />


                <rect x="165" y="360" width="180" height="20" rx="12" fill="#F0C419" />
            </svg>
        </div>

        <div>
            <svg class="card" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

                <rect x="30" y="80" width="450" height="300" rx="30" fill="#F0C41B" />

                <rect x="30" y="125" width="450" height="50" rx="0" fill="#806F5E" />

                <rect x="65" y="220" width="80" height="15" rx="10" fill="#F9EAB0" />
                <rect x="160" y="220" width="80" height="15" rx="10" fill="#F9EAB0" />

                <rect x="65" y="255" width="20" height="15" rx="10" fill="#F9EAB0" />
                <rect x="105" y="255" width="30" height="15" rx="10" fill="#F9EAB0" />

                <rect x="150" y="255" width="20" height="15" rx="10" fill="#F9EAB0" />
                <rect x="185" y="255" width="30" height="15" rx="10" fill="#F9EAB0" />

                <rect x="225" y="255" width="15" height="15" rx="10" fill="#F9EAB0" />

                <circle cx="330" cy="310" r="42" fill="#DB2215" />
                <circle cx="390" cy="310" r="42" fill="#245EA9" />
            </svg>
        </div>

        <div>
            <svg class="youtube_logo" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="6" width="85" height="58" rx="15" ry="25" fill="#D8362A" />
                <polygon points="42,20 42,50 66,35" fill="#FFFFFF" />
            </svg>
        </div>

        <div>
            <svg class="calculator" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

                <rect x="30" y="30" width="350" height="450" rx="30" fill="#000000" />
                <rect x="75" y="80" width="260" height="80" rx="20" fill="#fff" />

                <rect x="75" y="250" width="110" height="20" rx="10" fill="#fff" />
                <rect x="120" y="205" width="20" height="110" rx="10" fill="#fff" />

                <rect x="170" y="155" width="110" height="20" rx="10" fill="#fff" transform="rotate(45, 130, 260)" />
                <rect x="-20" y="155" width="110" height="20" rx="10" fill="#fff" transform="rotate(135, 130, 260)" />

                <rect x="75" y="390" width="110" height="20" rx="10" fill="#fff" />

                <rect x="70" y="45" width="110" height="20" rx="10" fill="#fff" transform="rotate(135, 130, 260)" />
                <circle cx="250" cy="370" r="15" fill="#fff" />
                <circle cx="310" cy="430" r="15" fill="#fff" />


            </svg>

        </div>

        <div>
            <svg class="crown" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M150 400L85 225L195 320L255 125L330 320L440 225L380 400H150Z" />
                <line x1="150" y1="430" x2="380" y2="430" />
            </svg>
        </div>

        <div>
            <svg class="key" viewBox="0 0 612 612" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="20" width="280" height="200" rx="100" stroke="000" />

                <rect x="145" y="260" width="8" height="450" rx="0" fill="#000" />

                <rect x="128" y="250" width="45" height="15" rx="0" fill="#000" />

                <rect x="145" y="580" width="180" height="15" rx="0" fill="#000" />

                <rect x="145" y="500" width="110" height="15" rx="0" fill="#000" />

                <rect x="145" y="420" width="50" height="15" rx="0" fill="#000" />


            </svg>
        </div>

    </div>
</body>

</html>
