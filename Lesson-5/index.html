<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="page-wrapper">
        <p class="info-1">CSS Weather Forecast </p>
        <div class="forecast-wrapper">
            <div class="item w-50" style="background-color: #3399CC;">
                <span>Lisbon</span><br>
                <span class="degree">21&deg;C <img src="../images/icon.png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #33CCCC;">
                <span>Paris</span><br>
                <span class="degree">11&deg;C <img src="../images/icon (1).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #996699;">
                <span>Belgrade</span><br>
                <span class="degree">15&deg;C <img src="../images/icon (2).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #C24747;">
                <span>Venice</span><br>
                <span class="degree">21&deg;C <img src="../images/icon (3).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #E2674A;">
                <span>Tel-Aviv</span><br>
                <span class="degree">32&deg;C <img src="../images/icon (4).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #FFCC66;">
                <span>Cairo</span><br>
                <span class="degree">21&deg;C <img src="../images/icon (5).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #99CC99;">
                <span>New-York</span><br>
                <span class="degree">17&deg;C <img src="../images/icon (6).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #669999;">
                <span>New-Delhi</span><br>
                <span class="degree">17&deg;C <img src="../images/icon (7).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item w-50" style="background-color: #CC6699;">
                <span>San-Francisco</span><br>
                <span class="degree">15&deg;C <img src="../images/icon (8).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item" style="background-color: #339966;">
                <span>Tokyo</span><br>
                <span class="degree">8&deg;C <img src="../images/icon (9).png" alt="icon" class="icon">
                </span>
            </div>
            <div class="item w-100" style="background-color: #666699;">
                <span>Sydney</span><br>
                <span class="degree">25&deg;C <img src="../images/icon (10).png" alt="icon" class="icon">
                </span>
            </div>

        </div>
    </div>
</body>

</html>
