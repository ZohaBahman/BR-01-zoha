<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./styles/main9.css">

</head>


<body>
    <header class="header">
        <div class="container_row">
            <a href="#" class="logo_link">
                <img src="./assets/logo.svg" alt="logo">
            </a>

            <div class="nav_container">
                <nav class="nav">
                    <a class="nav_link" href="#">
                        home
                    </a>
                    <a class="nav_link" href="#">
                        services
                    </a>
                    <a class="nav_link" href="#">
                        about
                    </a>
                    <a class="nav_link" href="#">
                        contacts
                    </a>
                </nav>
            </div>

            <div class="header_actions">
                <button class="button_transparent">CALLBACK</button>
            </div>

        </div>

        <section class="team">
            <div class="container">
                <h2 class="team_title">who we are</h2>
                <p class="team_description">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
                    tempor incididunt ut labore et dolore magna aliqua.</p>
            </div>

            <div class="team_members">
                <div class="member">

                    <div>
                        <img class="member_img" src="./assets/john.jpg" alt="john handson">
                        <h3 class="member_name">john handson</h3>
                        <p class="role">lead designer</p>
                    </div>
                    <div>
                        <img class="member_img" src="./assets/alex.jpg" alt="alex cutter">
                        <h3 class="member_name">alex cutter</h3>
                        <p class="role">developer</p>
                    </div>
                    <div>
                        <img class="member_img" src="./assets/elena.jpg" alt="Elena Simpson">
                        <h3 class="member_name">Elena Simpson</h3>
                        <p class="role">artist</p>
                    </div>
                    <div>
                        <img class="member_img" src="./assets/lily.png" alt="lily allen">
                        <h3 class="member_name">lily allen</h3>
                        <p class="role">lead designer</p>
                    </div>
                </div>
            </div>
        </section>
    </header>

    <footer class="footer">
        <div class="footer_container">
            <a href="#" class="logo_link">
                <img src="./assets/logo.svg" alt="logo">
            </a>
        </div>

        <div class="nav_container">
            <nav class="nav">
                <a class="nav_link" href="#">
                    home
                </a>
                <a class="nav_link" href="#">
                    services
                </a>
                <a class="nav_link" href="#">
                    about
                </a>
                <a class="nav_link" href="#">
                    contacts
                </a>
            </nav>
        </div>

        <div class="media_link">
            <a href="#" class="twitter">
                <img src="./assets/twitter.png" alt="twitter">
            </a>
            <a href="#" class="facebook">
                <img src="./assets/facebook.png" alt="facebook">
            </a>
            <a href="#" class="instagram">
                <img src="./assets/instagram.png" alt="instagram">
            </a>
            <a href="#" class="linkedin">
                <img src="./assets/linkedin.png" alt="linkedin">
            </a>
            <a href="#" class="telegram">
                <img src="./assets/telegram.png" alt="telegram">
            </a>
        </div>




    </footer>

</html>
